name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Closures and Weather Hazards
        run: |
          python -c "
          import urllib.request, json, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          urls = [
              ('https://511.vdot.virginia.gov/services/map/layers/map/closures', 'closure_layer'),
              ('https://511.vdot.virginia.gov/services/map/layers/map/events', 'event_layer'),
              ('https://511.vdot.virginia.gov/services/map/layers/map/incidents', 'incident_layer')
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://511.vdot.virginia.gov/'
          }

          routine_vehicle_types = [
              'disabled vehicle', 'vehicle accident', 'multi-vehicle accident',
              'vehicle crash', 'vehicle fire', 'disabled bus'
          ]

          weather_keywords = [
              'tree', 'trees', 'limb', 'limbs', 'branch', 'debris',
              'flood', 'flooding', 'high water', 'standing water', 'water over', 'water on road',
              'wire', 'wires', 'pole', 'line down', 'lines down',
              'ice', 'snow', 'freezing', 'sleet', 'slick', 'weather', 'impassable'
          ]

          filtered_features = []
          seen_ids = set()

          for url, layer_type in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          feats = json.loads(text).get('features', [])
                          for f in feats:
                              item_id = f.get('id') or f.get('properties', {}).get('id')
                              if item_id and item_id in seen_ids:
                                  continue

                              props = f.get('properties', {})
                              inc_type = str(props.get('type', '')).lower()
                              msg = (str(props.get('message_511', '')) + ' ' + str(props.get('location', ''))).lower()
                              icon = str(props.get('icon', '')).lower()

                              is_routine_vehicle = any(rv in inc_type for rv in routine_vehicle_types)
                              has_weather = any(wk in msg or wk in inc_type for wk in weather_keywords)
                              is_full_road_closed = 'road closed' in msg or 'all lanes closed' in msg or 'both directions closed' in msg

                              # 1. Always keep ALL items from the closures or events layers
                              if layer_type in ['closure_layer', 'event_layer'] or icon in ['closure', 'weatherclosure', 'event']:
                                  filtered_features.append(f)
                                  if item_id: seen_ids.add(item_id)
                                  continue

                              # 2. Always keep weather hazards or full road closures from incidents layer
                              if has_weather or is_full_road_closed:
                                  filtered_features.append(f)
                                  if item_id: seen_ids.add(item_id)
                                  continue

                              # 3. Discard routine broken-down vehicles and minor crashes
                              if is_routine_vehicle:
                                  continue

                              # 4. Keep remaining non-routine incidents
                              filtered_features.append(f)
                              if item_id: seen_ids.add(item_id)

              except Exception as e:
                  print(f'Error fetching {url}: {e}')

          out_data = {'type': 'FeatureCollection', 'features': filtered_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Successfully written {len(filtered_features)} items to vdot.json')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Capture closures and weather events without vehicle noise" || exit 0
          git push
