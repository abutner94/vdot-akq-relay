name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Strictly Weather Hazards and Closures
        run: |
          python -c "
          import urllib.request, json, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          urls = [
              'https://511.vdot.virginia.gov/services/map/layers/map/closures',
              'https://511.vdot.virginia.gov/services/map/layers/map/events',
              'https://511.vdot.virginia.gov/services/map/layers/map/incidents'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://511.vdot.virginia.gov/'
          }

          # Specific weather keywords (removed generic 'closed' / 'hazard' words)
          weather_phrases = [
              'tree', 'trees', 'limb', 'limbs', 'branch', 'debris',
              'flood', 'flooding', 'high water', 'standing water', 'water over road', 'water on road',
              'wire', 'wires', 'pole', 'line down', 'lines down',
              'ice', 'snow', 'freezing', 'sleet', 'slick',
              'weather', 'impassable'
          ]

          # Strict routine traffic types to discard
          routine_traffic_types = [
              'disabled vehicle', 'vehicle accident', 'multi-vehicle accident',
              'vehicle crash', 'vehicle fire', 'other traffic', 'congestion',
              'construction', 'maintenance', 'disabled bus', 'work zone'
          ]

          filtered_features = []
          seen_ids = set()

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          feats = json.loads(text).get('features', [])
                          for f in feats:
                              item_id = f.get('id') or f.get('properties', {}).get('id')
                              if item_id in seen_ids:
                                  continue

                              props = f.get('properties', {})
                              inc_type = str(props.get('type', '')).lower()
                              msg = (str(props.get('message_511', '')) + ' ' + str(props.get('location', ''))).lower()
                              icon = str(props.get('icon', '')).lower()

                              is_routine = any(rt in inc_type for rt in routine_traffic_types)
                              has_weather = any(wp in msg or wp in inc_type for wp in weather_phrases)
                              is_weather_icon = icon in ['weatherclosure', 'event'] or 'weather' in inc_type

                              # Drop routine traffic unless explicit weather terms are present
                              if is_routine and not has_weather:
                                  continue

                              # Keep if it contains explicit weather terms or is a weather event
                              if has_weather or is_weather_icon:
                                  filtered_features.append(f)
                                  if item_id:
                                      seen_ids.add(item_id)
              except Exception as e:
                  print(f'Error fetching {url}: {e}')

          out_data = {'type': 'FeatureCollection', 'features': filtered_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Successfully saved {len(filtered_features)} strictly weather-related items to vdot.json')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Filter strictly weather hazards" || exit 0
          git push
