name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Weather Closures and Hazards from VDOT
        run: |
          python -c "
          import urllib.request, json, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          # VDOT routes all real-time closures and weather events through this endpoint
          url = 'https://511.vdot.virginia.gov/services/map/layers/map/incidents'

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://511.vdot.virginia.gov/'
          }

          routine_noise_types = [
              'disabled vehicle', 'disabled bus', 'vehicle accident',
              'multi-vehicle accident', 'vehicle crash', 'vehicle fire',
              'other traffic', 'congestion'
          ]

          weather_keywords = [
              'weather', 'tree', 'trees', 'limb', 'limbs', 'branch', 'debris',
              'flood', 'flooding', 'high water', 'standing water', 'water over',
              'water on road', 'wire', 'wires', 'pole', 'line down', 'lines down',
              'ice', 'snow', 'freezing', 'sleet', 'slick', 'impassable'
          ]

          filtered_features = []

          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                  text = resp.read().decode('utf-8').strip()
                  if text.startswith('{') and 'features' in text:
                      feats = json.loads(text).get('features', [])
                      print(f'Total raw VDOT items fetched: {len(feats)}')

                      for f in feats:
                          props = f.get('properties', {})
                          inc_type = str(props.get('type', '')).lower()
                          msg = str(props.get('message_511', '')).lower()
                          icon = str(props.get('icon', '')).lower()

                          # 1. Match explicit weather closures or closure icons
                          is_weather_type = 'weather' in inc_type or 'closure' in inc_type or icon in ['weatherclosure', 'closure', 'event']

                          # 2. Match weather terms in description or incident type
                          has_weather_kw = any(wk in msg or wk in inc_type for wk in weather_keywords)

                          # 3. Identify routine non-weather traffic noise
                          is_routine_noise = any(rt in inc_type for rt in routine_noise_types)

                          # KEEP if weather closure/event OR contains weather keywords; DISCARD routine crashes/breakdowns
                          if (is_weather_type or has_weather_kw) and not (is_routine_noise and not has_weather_kw and not is_weather_type):
                              filtered_features.append(f)

          except Exception as e:
              print(f'Error fetching VDOT feed: {e}')

          out_data = {'type': 'FeatureCollection', 'features': filtered_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Saved {len(filtered_features)} weather closures/hazards to vdot.json')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Isolate weather closures and events" || exit 0
          git push
