name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Weather Hazards and Closures Only
        run: |
          python -c "
          import urllib.request, json, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          urls = [
              'https://511.vdot.virginia.gov/services/map/layers/map/closures',
              'https://511.vdot.virginia.gov/services/map/layers/map/events',
              'https://511.vdot.virginia.gov/services/map/layers/map/incidents'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://511.vdot.virginia.gov/'
          }

          # Explicit exclusions to discard routine traffic items
          exclude_types = [
              'disabled vehicle', 'vehicle accident', 'multi-vehicle accident',
              'vehicle crash', 'vehicle fire', 'other traffic', 'congestion',
              'construction', 'maintenance', 'disabled bus'
          ]

          # Weather and closure keywords to match
          weather_keywords = [
              'weather', 'closure', 'closed', 'flood', 'high water', 'standing water',
              'water over road', 'tree', 'limb', 'branch', 'debris', 'wire', 'pole',
              'line down', 'impassable', 'ice', 'snow', 'freezing', 'slick', 'wind', 'hazard'
          ]

          filtered_features = []
          seen_ids = set()

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          feats = json.loads(text).get('features', [])
                          for f in feats:
                              item_id = f.get('id') or f.get('properties', {}).get('id')
                              if item_id in seen_ids:
                                  continue

                              props = f.get('properties', {})
                              inc_type = str(props.get('type', '')).lower()
                              msg = (str(props.get('message_511', '')) + ' ' + str(props.get('location', ''))).lower()
                              icon = str(props.get('icon', '')).lower()

                              is_excluded = any(ex in inc_type for ex in exclude_types)
                              has_weather_kw = any(wk in msg for wk in weather_keywords) or any(wk in inc_type for wk in weather_keywords)
                              is_closure_or_event = icon in ['closure', 'weatherclosure', 'event'] or 'closure' in inc_type or 'weather' in inc_type

                              # Keep if it is a closure/weather event, or contains weather keywords and isn't a routine vehicle crash
                              if (is_closure_or_event or has_weather_kw) and not (is_excluded and not has_weather_kw):
                                  filtered_features.append(f)
                                  if item_id:
                                      seen_ids.add(item_id)
              except Exception as e:
                  print(f'Error fetching {url}: {e}')

          out_data = {'type': 'FeatureCollection', 'features': filtered_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Filtered and saved {len(filtered_features)} weather/closure incidents.')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Auto-update VDOT weather hazards" || exit 0
          git push
