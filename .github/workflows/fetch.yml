name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Live VDOT Weather Hazards via Python
        run: |
          python -c "
          import urllib.request, json, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          urls = [
              'https://511.vdot.virginia.gov/services/map/layers/map/incidents',
              'https://511.vdot.virginia.gov/services/map/layers/map/closures',
              'https://511.vdot.virginia.gov/services/map/layers/map/events'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://511.vdot.virginia.gov/'
          }

          # Keywords to isolate weather hazards
          keywords = ['tree', 'limb', 'branch', 'flood', 'water', 'closure', 'closed', 'debris', 'wire', 'pole', 'ice', 'snow', 'hazard', 'impassable']

          weather_features = []

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          feats = json.loads(text).get('features', [])
                          for f in feats:
                              props = f.get('properties', {})
                              msg = (str(props.get('message_511', '')) + ' ' + str(props.get('type', ''))).lower()
                              # Save if description matches any weather keyword OR if it's a road closure
                              if any(k in msg for k in keywords) or props.get('icon') == 'closure':
                                  weather_features.append(f)
              except Exception as e:
                  print(f'Error fetching {url}: {e}')

          out_data = {'type': 'FeatureCollection', 'features': weather_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Saved {len(weather_features)} weather-related hazards to vdot.json')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Auto-update VDOT weather hazards" || exit 0
          git push
