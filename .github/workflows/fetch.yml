name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Weather Closures and Hazards
        run: |
          python -c "
          import urllib.request, json, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          # Target all 511 Virginia map layer feeds
          urls = [
              'https://511.vdot.virginia.gov/services/map/layers/map/closures',
              'https://511.vdot.virginia.gov/services/map/layers/map/weatherclosures',
              'https://511.vdot.virginia.gov/services/map/layers/map/events',
              'https://511.vdot.virginia.gov/services/map/layers/map/incidents'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://511.vdot.virginia.gov/'
          }

          filtered_features = []
          seen_ids = set()

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          feats = json.loads(text).get('features', [])
                          for f in feats:
                              item_id = f.get('id') or f.get('properties', {}).get('id')
                              if item_id and item_id in seen_ids:
                                  continue

                              props = f.get('properties', {})
                              inc_type = str(props.get('type', '')).lower()
                              msg = (str(props.get('message_511', '')) + ' ' + str(props.get('location', ''))).lower()

                              # Discard ONLY pure breakdowns/crashes with zero weather or road closure context
                              is_pure_disabled = inc_type in ['disabled vehicle', 'disabled bus'] and 'weather' not in msg and 'closure' not in msg
                              is_pure_crash = inc_type in ['vehicle accident', 'multi-vehicle accident', 'vehicle crash'] and 'weather' not in msg and 'closure' not in msg and 'tree' not in msg and 'flood' not in msg

                              if is_pure_disabled or is_pure_crash:
                                  continue

                              # Retain all weather closures, road closures, detours, and weather events
                              filtered_features.append(f)
                              if item_id:
                                  seen_ids.add(item_id)
              except Exception as e:
                  print(f'Fetching {url}: {e}')

          out_data = {'type': 'FeatureCollection', 'features': filtered_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Successfully saved {len(filtered_features)} weather closures/hazards.')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Capture Appomattox weather closure" || exit 0
          git push
