name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Live VDOT Data
        run: |
          # Fetch with browser headers so VDOT returns JSON instead of the HTML web app
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Referer: https://www.511virginia.org/" \
            "https://www.511virginia.org/data/geojson/icons.incidents.geojson" -o vdot.json

          # If the server still sends HTML, fallback to the public VDOT ArcGIS REST FeatureServer
          if head -n 5 vdot.json | grep -q "<"; then
            echo "511 server returned HTML, switching to VDOT ArcGIS endpoint..."
            curl -sL "https://services1.arcgis.com/K1209S082P1I9083/arcgis/rest/services/VDOT_Incidents/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson" -o vdot.json
          fi

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Auto-update VDOT feed" || exit 0
          git push
