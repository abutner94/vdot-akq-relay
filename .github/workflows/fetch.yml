name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Live VDOT Data via Python
        run: |
          python -c "
          import urllib.request, json

          # Fallback list includes VDOT Open Data ArcGIS endpoint (never blocks Cloud IPs)
          urls = [
              'https://services1.arcgis.com/K1209S082P1I9083/arcgis/rest/services/VDOT_Incidents/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson',
              'https://www.511virginia.org/data/geojson/icons.incident.geojson'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'application/json'
          }

          out_data = {'type': 'FeatureCollection', 'features': []}

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          parsed = json.loads(text)
                          if 'features' in parsed:
                              out_data = parsed
                              print(f'Successfully pulled data from {url}')
                              break
              except Exception as e:
                  print(f'Failed {url}: {e}')

          # Always overwrite vdot.json with valid GeoJSON
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Auto-update VDOT feed" || exit 0
          git push
