name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Live VDOT Data via Python
        run: |
          python -c "
          import urllib.request, json

          urls = [
              'https://www.511virginia.org/data/geojson/icons.incident.geojson',
              'https://511.vdot.virginia.gov/data/geojson/icons.incident.geojson',
              'https://www.511virginia.org/data/geojson/icons.closures.geojson'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://www.511virginia.org/'
          }

          success = False
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          parsed = json.loads(text)
                          with open('vdot.json', 'w') as f:
                              json.dump(parsed, f)
                          print(f'Successfully updated vdot.json from {url}')
                          success = True
                          break
              except Exception as e:
                  print(f'Failed {url}: {e}')

          if not success:
              print('Warning: No endpoints returned valid GeoJSON')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Auto-update VDOT feed" || exit 0
          git push
