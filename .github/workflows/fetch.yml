name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Live VDOT Data via Python
        run: |
          python -c "
          import urllib.request, json, ssl

          # Bypass SSL handshake drops on state endpoints
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          urls = [
              'https://www.511virginia.org/data/geojson/icons.incident.geojson',
              'https://www.511virginia.org/data/geojson/icons.closures.geojson',
              'https://www.511virginia.org/data/geojson/icons.weatherclosure.geojson'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://www.511virginia.org/'
          }

          all_features = []

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          parsed = json.loads(text)
                          feats = parsed.get('features', [])
                          print(f'{url}: fetched {len(feats)} features')
                          all_features.extend(feats)
                      else:
                          print(f'{url}: non-JSON response ({text[:60]})')
              except Exception as e:
                  print(f'{url}: failed with {e}')

          out_data = {'type': 'FeatureCollection', 'features': all_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Total features written to vdot.json: {len(all_features)}')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Auto-update VDOT feed" || exit 0
          git push
