name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Weather Closures and Hazards
        run: |
          python -c "
          import urllib.request, json, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          urls = [
              'https://511.vdot.virginia.gov/services/map/layers/map/incidents',
              'https://511.vdot.virginia.gov/services/map/layers/map/events',
              'https://511.vdot.virginia.gov/services/map/layers/map/closures'
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://511.vdot.virginia.gov/'
          }

          # Strictly Discard Routine Breakdowns/Crashes (ONLY if no weather/closure keywords exist)
          routine_noise_types = [
              'disabled vehicle', 'disabled bus', 'vehicle accident',
              'multi-vehicle accident', 'vehicle crash', 'vehicle fire',
              'congestion', 'construction'
          ]

          # Terms that explicitly classify an item as weather-related or a valid road closure
          weather_closure_terms = [
              'weather', 'closure', 'closed', 'detour', 'flood', 'flooding',
              'high water', 'water over', 'water on road', 'tree', 'trees',
              'limb', 'limbs', 'branch', 'debris', 'wire', 'wires', 'pole',
              'line down', 'lines down', 'ice', 'snow', 'freezing', 'sleet',
              'slick', 'impassable', 'downed', 'hazard'
          ]

          filtered_features = []
          seen_ids = set()

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                      text = resp.read().decode('utf-8').strip()
                      if text.startswith('{') and 'features' in text:
                          feats = json.loads(text).get('features', [])
                          print(f'{url}: raw count = {len(feats)}')

                          for f in feats:
                              item_id = str(f.get('id') or f.get('properties', {}).get('id') or '')
                              if item_id and item_id in seen_ids:
                                  continue

                              props = f.get('properties', {})
                              
                              # Concatenate all potential text fields to prevent missing data
                              full_text = ' '.join([
                                  str(props.get('type', '')),
                                  str(props.get('event_type', '')),
                                  str(props.get('category', '')),
                                  str(props.get('message_511', '')),
                                  str(props.get('description', '')),
                                  str(props.get('details', '')),
                                  str(props.get('headline', ''))
                              ]).lower()

                              icon = str(props.get('icon', '')).lower()
                              inc_type = str(props.get('type', '')).lower()

                              has_weather_or_closure = any(term in full_text for term in weather_closure_terms) or icon in ['weatherclosure', 'closure', 'event']
                              is_routine_noise = any(rt in inc_type for rt in routine_noise_types)

                              # IF it contains weather or closure keywords, ALWAYS KEEP IT (overrides routine noise)
                              if has_weather_or_closure:
                                  filtered_features.append(f)
                                  if item_id: seen_ids.add(item_id)
                                  continue

                              # DISCARD routine traffic if no weather/closure keywords are found
                              if is_routine_noise:
                                  continue

                              # Keep non-routine items by default
                              filtered_features.append(f)
                              if item_id: seen_ids.add(item_id)

              except Exception as e:
                  print(f'Error fetching {url}: {e}')

          out_data = {'type': 'FeatureCollection', 'features': filtered_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Total weather/closure items saved to vdot.json: {len(filtered_features)}')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Comprehensive weather and closure text search" || exit 0
          git push
