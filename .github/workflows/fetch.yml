name: VDOT Feed Relay
on:
  schedule:
    - cron: '*/5 * * * *' # Pulls new VDOT data every 5 minutes
  workflow_dispatch: # Allows manual triggers

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Weather Closures and Hazards
        run: |
          python -c "
          import urllib.request, json, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          url = 'https://511.vdot.virginia.gov/services/map/layers/map/incidents'

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/122.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://511.vdot.virginia.gov/'
          }

          routine_noise = [
              'disabled vehicle', 'disabled bus', 'vehicle accident',
              'multi-vehicle accident', 'vehicle crash', 'vehicle fire',
              'other traffic', 'congestion'
          ]

          filtered_features = []

          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                  text = resp.read().decode('utf-8').strip()
                  if text.startswith('{') and 'features' in text:
                      data = json.loads(text)
                      feats = data.get('features', [])
                      print(f'Raw VDOT items fetched: {len(feats)}')

                      for f in feats:
                          props = f.get('properties', {})
                          inc_type = str(props.get('type', '')).strip().lower()
                          msg = str(props.get('message_511', '')).strip().lower()
                          icon = str(props.get('icon', '')).strip().lower()

                          is_routine = any(rn in inc_type for rn in routine_noise)
                          has_weather_or_closure = any(k in msg or k in inc_type for k in ['weather', 'closure', 'closed', 'detour', 'flood', 'tree', 'debris', 'hazard', 'impassable', 'high water']) or icon in ['weatherclosure', 'closure', 'event']

                          # Skip pure routine traffic that lacks weather or closure keywords
                          if is_routine and not has_weather_or_closure:
                              continue

                          # Retain weather closures, road closures, and weather hazards
                          if has_weather_or_closure or 'weather' in inc_type or 'closure' in inc_type:
                              filtered_features.append(f)

          except Exception as e:
              print(f'Error fetching VDOT feed: {e}')

          out_data = {'type': 'FeatureCollection', 'features': filtered_features}
          with open('vdot.json', 'w') as f:
              json.dump(out_data, f)
          print(f'Saved {len(filtered_features)} weather items to vdot.json')
          "

      - name: Commit Updated Feed
        run: |
          git config --global user.name "NWS Relay Bot"
          git config --global user.email "bot@github.com"
          git add vdot.json
          git commit -m "Capture weather closures and events" || exit 0
          git push
